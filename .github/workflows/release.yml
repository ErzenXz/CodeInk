name: Desktop releases
on:
  push:
    branches: [main, development]
    paths-ignore: ["website/**", "**/*.md", "LICENSE", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun typecheck
        working-directory: packages/desktop
      - run: bun run test
        working-directory: packages/desktop
      - run: bun typecheck
        working-directory: packages/app
      - run: bun typecheck
        working-directory: packages/session-ui
      - run: bun typecheck
        working-directory: packages/ui
      - run: bun run test
        working-directory: packages/app
      - run: bun run test
        working-directory: packages/session-ui
      - run: bun run test
        working-directory: packages/ui
      - run: bun run typecheck:e2e
        working-directory: packages/app
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/app
      - name: Verify session layout and streaming
        run: bun run test:e2e e2e/regression/new-chat-overview.spec.ts e2e/regression/session-tab-position.spec.ts e2e/regression/session-stream-scroll.spec.ts e2e/regression/codeink-agent-popup.spec.ts e2e/user-story/model-selection-flow.spec.ts e2e/user-story/git-workspace-selector.spec.ts --workers=2 --retries=0
        working-directory: packages/app
      - run: bun run test:terminal
        working-directory: packages/desktop
      - id: version
        run: bun scripts/release-version.ts
      - name: Record release metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg channel "$RELEASE_CHANNEL" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$GITHUB_SHA" \
            '{version:$version,channel:$channel,tag:$tag,commit:$commit}' > release-meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          retention-days: 14
          path: release-meta.json
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: mac, arch: arm64 }
          - { runner: macos-15-intel, platform: mac, arch: x64 }
          - { runner: windows-2022, platform: win, arch: x64 }
          - { runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CODEINK_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun scripts/release-version.ts
      - name: Require macOS signing and notarization credentials
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required macOS release secret: $name" >&2
              exit 1
            fi
          done
      - name: Verify native protocol processes
        run: bun test src/test/protocols.test.ts src/test/usage.test.ts
        working-directory: packages/desktop
      - name: Verify native terminal
        run: bun run test:terminal
        working-directory: packages/desktop
      - run: bun run build
        working-directory: packages/desktop
      - name: Prepare Apple notarization key
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$HOME/Library/Keychains/login.keychain-db"
      - name: Package installers
        run: bun scripts/package.ts --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Install Linux Electron runtime dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Verify packaged CodeInk Agent without model usage
        run: bun run test:packaged
        working-directory: packages/desktop
      - name: Submit signed macOS disk image to Apple
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          app=$(find packages/desktop/dist -mindepth 2 -maxdepth 2 -type d -name 'CodeInk*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -q 'Authority=Developer ID Application:'
          dmg=$(find packages/desktop/dist -maxdepth 1 -name "codeink-${CODEINK_CHANNEL}-*-mac-${{ matrix.arch }}.dmg" -print -quit)
          test -n "$dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --no-wait --output-format json > "$RUNNER_TEMP/notary.json"
          jq -e '.id | strings | select(length > 0)' "$RUNNER_TEMP/notary.json" >/dev/null
          jq -n \
            --arg id "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
            --arg sha256 "$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)" \
            '{id:$id,sha256:$sha256}' > "packages/desktop/dist/notary-${{ matrix.arch }}.json"
          echo "Apple submission: $(jq -r .id "$RUNNER_TEMP/notary.json")"
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'mac'
        with:
          name: signed-mac-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/notary-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        if: matrix.platform != 'mac'
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
