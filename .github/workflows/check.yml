name: Checks
on:
  pull_request:
    branches: [main, development]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun typecheck
        working-directory: packages/desktop
      - run: bun run test
        working-directory: packages/desktop
      - run: bun typecheck
        working-directory: packages/app
      - run: bun typecheck
        working-directory: packages/session-ui
      - run: bun typecheck
        working-directory: packages/ui
      - run: bun run test
        working-directory: packages/app
      - run: bun run test
        working-directory: packages/session-ui
      - run: bun run test
        working-directory: packages/ui
      - run: bun run typecheck:e2e
        working-directory: packages/app
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/app
      - name: Verify session layout and streaming
        run: bun run test:e2e e2e/regression/new-chat-overview.spec.ts e2e/regression/session-tab-position.spec.ts e2e/regression/session-stream-scroll.spec.ts e2e/regression/codeink-agent-popup.spec.ts e2e/user-story/model-selection-flow.spec.ts --workers=2 --retries=0
        working-directory: packages/app
