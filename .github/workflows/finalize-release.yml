name: Finalize desktop releases
on:
  workflow_run:
    workflows: [Desktop releases]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Desktop releases run to check
        required: false
        type: string
permissions:
  actions: read
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.sources.outputs.sources }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_RUN: ${{ inputs.source_run }}
        run: |
          if [[ "$EVENT_NAME" == workflow_run && "$EVENT_CONCLUSION" != success ]]; then
            echo 'sources=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$INPUT_RUN" ]]; then
            candidates=("$INPUT_RUN")
          elif [[ "$EVENT_NAME" == workflow_run ]]; then
            candidates=("$EVENT_RUN")
          else
            candidates=()
            for branch in main development; do
              run=$(gh run list --workflow release.yml --branch "$branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [[ -n "$run" ]]; then candidates+=("$run"); fi
            done
          fi

          entries=$(mktemp)
          for source_run in "${candidates[@]}"; do
            metadata=$(mktemp -d)
            if ! gh run download "$source_run" -n release-meta -D "$metadata"; then
              rm -rf "$metadata"
              continue
            fi
            tag=$(jq -r '.tag' "$metadata/release-meta.json")
            sha=$(jq -r '.commit' "$metadata/release-meta.json")
            rm -rf "$metadata"
            if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == false ]]; then
              continue
            fi
            jq -cn --argjson source_run "$source_run" --arg source_sha "$sha" '{source_run:$source_run,source_sha:$source_sha}' >> "$entries"
          done
          echo "sources=$(jq -sc . "$entries")" >> "$GITHUB_OUTPUT"
          rm -f "$entries"

  finalize:
    needs: resolve
    if: needs.resolve.outputs.sources != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.sources) }}
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: finalize-release-${{ matrix.source_run }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: release-meta
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: release-meta
      - uses: actions/download-artifact@v4
        with:
          name: signed-mac-arm64
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: signed/arm64
      - uses: actions/download-artifact@v4
        with:
          name: signed-mac-x64
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: signed/x64
      - id: status
        name: Check Apple submissions
        run: |
          pending=0
          for arch in arm64 x64; do
            submission=$(jq -r .id "signed/$arch/notary-$arch.json")
            result=$(xcrun notarytool info "$submission" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --output-format json)
            status=$(jq -r .status <<< "$result")
            echo "$arch: $status ($submission)"
            case "$status" in
              Accepted) ;;
              'In Progress') pending=1 ;;
              *)
                xcrun notarytool log "$submission" \
                  --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
                  --output-format json || true
                exit 1
                ;;
            esac
          done
          if [[ "$pending" == 1 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.status.outputs.ready == 'true'
        with:
          pattern: installers-*
          merge-multiple: true
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: release
      - name: Staple and verify both macOS packages
        if: steps.status.outputs.ready == 'true'
        run: |
          channel=$(jq -r .channel release-meta/release-meta.json)
          name=CodeInk
          if [[ "$channel" == early-access ]]; then name='CodeInk Early Access'; fi
          for arch in arm64 x64; do
            dmg=$(find "signed/$arch" -maxdepth 1 -name '*.dmg' -print -quit)
            zip=$(find "signed/$arch" -maxdepth 1 -name '*.zip' -print -quit)
            test -n "$dmg" && test -n "$zip"
            expected=$(jq -r .sha256 "signed/$arch/notary-$arch.json")
            actual=$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)
            test "$expected" == "$actual"

            work="$RUNNER_TEMP/codeink-$arch"
            mkdir -p "$work"
            ditto -x -k "$zip" "$work"
            app="$work/$name.app"
            test -d "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
            ditto -c -k --keepParent "$app" "release/$(basename "$zip")"

            cp "$dmg" "release/$(basename "$dmg")"
            xcrun stapler staple "release/$(basename "$dmg")"
            xcrun stapler validate "release/$(basename "$dmg")"
          done
      - name: Publish verified channel release
        if: steps.status.outputs.ready == 'true'
        env:
          RELEASE_COMMIT: ${{ matrix.source_sha }}
        run: |
          export RELEASE_TAG=$(jq -r .tag release-meta/release-meta.json)
          export RELEASE_VERSION=$(jq -r .version release-meta/release-meta.json)
          export RELEASE_CHANNEL=$(jq -r .channel release-meta/release-meta.json)
          bun scripts/publish-release.ts
